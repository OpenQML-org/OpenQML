[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openqml"
version = "0.23.0"
description = "Quantum-classical hybrid AI, quantitative research and cross-framework quantum programming"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "OpenQML contributors"}]
keywords = ["quantum", "machine-learning", "quantitative-finance", "pytorch", "jax", "interoperability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "packaging>=23",
  "psutil>=5.9",
  "numpy>=1.24; platform_system != 'Darwin' or platform_machine != 'x86_64'",
  "numpy>=1.26,<2; platform_system == 'Darwin' and platform_machine == 'x86_64'",
]

[project.urls]
Repository = "https://github.com/OpenQML-org/OpenQML"

[project.optional-dependencies]
torch = ["torch>=2.2"]
jax = ["jax>=0.4.30", "optax>=0.2"]
qiskit = ["qiskit[qasm3-import]>=1.2", "sympy>=1.12"]
aer = ["qiskit[qasm3-import]>=1.2", "qiskit-aer>=0.15", "sympy>=1.12"]
qasm = ["qiskit[qasm3-import]>=1.2", "openqasm3[parser]>=1.0", "sympy>=1.12"]
flax = ["jax>=0.4.30", "flax>=0.10", "optax>=0.2"]
symbolic = ["sympy>=1.12"]
compute = [
  # Older PennyLane builds on Python 3.10 and Intel macOS require autoray 0.7.
  "cotengra>=0.7.5,<0.8; python_version < '3.11' or (platform_system == 'Darwin' and platform_machine == 'x86_64')",
  "autoray>=0.7.2,<0.8; python_version < '3.11' or (platform_system == 'Darwin' and platform_machine == 'x86_64')",
  "cotengra>=0.8.3; python_version >= '3.11' and (platform_system != 'Darwin' or platform_machine != 'x86_64')",
  "autoray>=0.8.4; python_version >= '3.11' and (platform_system != 'Darwin' or platform_machine != 'x86_64')",
]
pennylane = ["pennylane>=0.40", "sympy>=1.12"]
cirq = ["cirq-core>=1.4", "sympy>=1.12"]
all = [
  "torch>=2.2", "jax>=0.4.30", "flax>=0.10", "optax>=0.2",
  "qiskit[qasm3-import]>=1.2", "qiskit-aer>=0.15", "pennylane>=0.40",
  "cirq-core>=1.4", "openqasm3[parser]>=1.0", "sympy>=1.12",
  "cotengra>=0.7.5,<0.8; python_version < '3.11' or (platform_system == 'Darwin' and platform_machine == 'x86_64')",
  "autoray>=0.7.2,<0.8; python_version < '3.11' or (platform_system == 'Darwin' and platform_machine == 'x86_64')",
  "cotengra>=0.8.3; python_version >= '3.11' and (platform_system != 'Darwin' or platform_machine != 'x86_64')",
  "autoray>=0.8.4; python_version >= '3.11' and (platform_system != 'Darwin' or platform_machine != 'x86_64')",
]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2", "twine>=6"]

[project.scripts]
openqml = "openqml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openqml = ["py.typed", "*.pyi"]
"openqml.finance" = ["*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/test_jax.py" = ["E402"]
"tests/test_torch.py" = ["E402"]
