[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openqml"
version = "0.1.0"
description = "An open exchange for quantum machine learning experiments: datasets, tasks, flows and runs, with the classical control arm built in."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OpenQML contributors" }]
keywords = ["quantum computing", "quantum machine learning", "benchmarks", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
pandas = ["pandas>=1.4"]
pennylane = ["pennylane>=0.33"]
dev = ["pytest>=7.0", "pandas>=1.4"]

[project.scripts]
openqml = "openqml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["openqml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
