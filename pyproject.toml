[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openqml"
version = "0.3.0a14"
description = "Differentiable quantum layers and diagnostic-driven quantum circuit interoperability"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "OpenQML contributors"}]
keywords = ["quantum", "machine-learning", "pytorch", "jax", "quantum-computing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "packaging>=23",
  "psutil>=5.9",
  "numpy>=1.24; platform_system != 'Darwin' or platform_machine != 'x86_64'",
  "numpy>=1.26,<2; platform_system == 'Darwin' and platform_machine == 'x86_64'",
  "torch>=2.2",
  "jax>=0.4.30",
  "flax>=0.10",
  "optax>=0.2",
  "qiskit[qasm3-import]>=1.2",
  "qiskit-aer>=0.15",
  "pennylane>=0.40",
  "cirq-core>=1.4",
  "openqasm3[parser]>=1.0",
  "sympy>=1.12",
]

[project.urls]
Repository = "https://github.com/OpenQML-org/OpenQML"

[project.optional-dependencies]
torch = []
jax = []
qiskit = []
aer = []
qasm = []
flax = []
symbolic = []
pennylane = []
cirq = []
all = []
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2", "twine>=6"]

[project.scripts]
openqml = "openqml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openqml = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/test_jax.py" = ["E402"]
"tests/test_torch.py" = ["E402"]
