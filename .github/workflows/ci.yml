name: Test and build
on:
  push:
    branches: [main, 'build/*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install "ruff>=0.11"
      - run: ruff check .
      - run: ruff format --check .
      - name: Show formatting changes on failure
        if: failure()
        run: ruff format --diff .
  tensor-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install . pytest
      - run: python -m pytest -q tests/test_contraction_compiler.py tests/test_distributed_compute.py
      - run: python -m pytest -q tests/test_hybrid_qnm.py -k distributed_hybrid_qnm
  hybrid-quant-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[jax,qiskit,dev]"
      - run: python -m pytest -q tests/test_density_geometry.py tests/test_multiperiod_allocation.py tests/test_loop_exits.py tests/test_streamed_geometry.py tests/test_scenario_tree.py tests/test_annotated_operations.py tests/test_distance_aware.py tests/test_execution_risk.py tests/test_hybrid_qnm.py tests/test_submission_training.py tests/test_expectile_risk.py tests/test_integer_division.py tests/test_classical_arithmetic.py tests/test_native_geometry.py tests/test_transport_geometry.py tests/test_classical_predicates.py tests/test_compilation_portability.py tests/test_package_layout.py
  public-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install . mypy
      - name: Check typed root and namespace imports
        run: |
          python -m mypy --ignore-missing-imports --follow-imports=silent -c '
          from typing import assert_type
          import openqml as oq
          from openqml.ir import Circuit
          from openqml.compute import ComputeKernel
          from openqml.runtime import PriorityBackend
          assert_type(oq.Circuit(2), Circuit)
          assert_type(oq.get_compute_kernel(), ComputeKernel)
          assert_type(oq.PriorityBackend(), PriorityBackend)
          '
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install only the core and test runner
        run: python -m pip install . pytest
      - run: python -m pip check
      - name: Verify shared compute policies and failure contracts
        run: python -m pytest -q tests/test_compute_kernel.py tests/test_reliability.py tests/test_entry_contracts.py tests/test_prepared_workflows.py tests/test_register_programs.py tests/test_accelerators.py tests/test_native_gpu.py
      - name: Exercise exact conversion without framework dependencies
        run: python -m pytest -q tests/test_multiperiod_allocation.py tests/test_precision_regressions.py tests/test_audit_regressions.py tests/test_switch_lowering.py tests/test_risk_budget.py tests/test_tensor_streaming.py tests/test_model_checkpoint.py tests/test_model_selection.py tests/test_walk_forward.py tests/test_conversion_sweeps.py tests/test_finance_execution.py tests/test_simple_api.py tests/test_adaptive_amplitude.py tests/test_amplitude.py tests/test_finance.py tests/test_frontier_models.py tests/test_network_operators.py tests/test_architecture.py tests/test_deep_learning.py tests/test_cost_scheduling.py tests/test_calibration.py tests/test_distributed_compute.py tests/test_multiscale_execution.py tests/test_gradient_accumulation.py tests/test_program_compilation.py tests/test_distributed_training.py tests/test_compute_contractions.py tests/test_contraction_compiler.py tests/test_runtime.py tests/test_hybrid_training.py tests/test_sparse_scaling.py tests/test_geometry_sampling.py tests/test_exact_instrument.py tests/test_public_api.py tests/test_package_scope.py tests/test_package_layout.py tests/test_execution_hotpaths.py tests/test_mitigation.py tests/test_model_streaming.py tests/test_environment_report.py tests/test_conversion_preparation.py tests/test_ir.py tests/test_simulator.py tests/test_qasm_feedback.py
      - run: python -m openqml doctor --report --check-imports --sizes --output core-environment.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-installation-${{ runner.os }}
          path: core-environment.json
  full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Select CPU PyTorch for the CI runner
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[all,dev]"
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python -m twine check dist/*
  legacy-frameworks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install "torch==2.2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "numpy==1.26.4" "jax==0.4.30" "jaxlib==0.4.30" "optax==0.2.3" "chex==0.1.87"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q tests/test_density_geometry.py tests/test_multiperiod_allocation.py tests/test_loop_exits.py tests/test_streamed_geometry.py tests/test_scenario_tree.py tests/test_annotated_operations.py tests/test_distance_aware.py tests/test_execution_risk.py tests/test_hybrid_qnm.py tests/test_submission_training.py tests/test_expectile_risk.py tests/test_compilation_portability.py tests/test_native_geometry.py tests/test_transport_geometry.py tests/test_native_fusion.py tests/test_execution_hotpaths.py tests/test_package_layout.py tests/test_compute_kernel.py tests/test_reliability.py tests/test_entry_contracts.py tests/test_prepared_workflows.py tests/test_register_programs.py tests/test_accelerators.py tests/test_native_gpu.py tests/test_native_constant_cache.py
  compiled-transforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "numpy==1.26.4" . pytest
      - run: python -m pytest -q tests/test_density_geometry.py tests/test_multiperiod_allocation.py tests/test_loop_exits.py tests/test_streamed_geometry.py tests/test_scenario_tree.py tests/test_annotated_operations.py tests/test_distance_aware.py tests/test_execution_risk.py tests/test_hybrid_qnm.py tests/test_submission_training.py tests/test_expectile_risk.py tests/test_compilation_portability.py tests/test_native_geometry.py tests/test_transport_geometry.py tests/test_native_fusion.py tests/test_activation_checkpointing.py tests/test_execution_hotpaths.py tests/test_package_layout.py
  portable-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: macos-15-intel
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[all,dev]" --report install-report.json
      - name: Configure macOS OpenMP for TorchInductor
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          omp_prefix=$(brew --prefix libomp)
          test -f "$omp_prefix/include/omp.h"
          echo "OMP_PREFIX=$omp_prefix" >> "$GITHUB_ENV"
      - name: Activate the Windows C++ toolchain for TorchInductor
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "Visual Studio C++ Build Tools are required for Inductor integration tests." }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -SkipAutomaticLocation -Arch amd64 -HostArch amd64
          if (-not (Get-Command cl -ErrorAction SilentlyContinue)) { throw "MSVC activation did not expose cl.exe." }
          foreach ($name in 'PATH', 'INCLUDE', 'LIB', 'LIBPATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - run: python -m pip check
      - run: python -m openqml doctor --extra all --check-imports --sizes --output environment-report.json
      - run: python -m pytest -q tests/test_density_geometry.py tests/test_multiperiod_allocation.py tests/test_loop_exits.py tests/test_streamed_geometry.py tests/test_scenario_tree.py tests/test_annotated_operations.py tests/test_distance_aware.py tests/test_execution_risk.py tests/test_hybrid_qnm.py tests/test_submission_training.py tests/test_expectile_risk.py tests/test_integer_division.py tests/test_classical_arithmetic.py tests/test_compilation_portability.py tests/test_native_fusion.py tests/test_register_programs.py tests/test_native_geometry.py tests/test_transport_geometry.py tests/test_classical_predicates.py
      - run: python -m pytest -q tests/test_compute_kernel.py tests/test_reliability.py tests/test_entry_contracts.py tests/test_prepared_workflows.py tests/test_accelerators.py tests/test_native_gpu.py tests/test_multiperiod_allocation.py tests/test_precision_regressions.py tests/test_audit_regressions.py tests/test_switch_lowering.py tests/test_risk_budget.py tests/test_tensor_streaming.py tests/test_model_checkpoint.py tests/test_model_selection.py tests/test_walk_forward.py tests/test_conversion_sweeps.py tests/test_finance_execution.py tests/test_simple_api.py tests/test_adaptive_amplitude.py tests/test_amplitude.py tests/test_finance.py tests/test_frontier_models.py tests/test_algorithmic_execution.py tests/test_network_operators.py tests/test_architecture.py tests/test_deep_learning.py tests/test_cost_scheduling.py tests/test_calibration.py tests/test_distributed_compute.py tests/test_multiscale_execution.py tests/test_gradient_accumulation.py tests/test_program_compilation.py tests/test_distributed_training.py tests/test_compute_contractions.py tests/test_contraction_compiler.py tests/test_runtime.py tests/test_hybrid_training.py tests/test_sparse_scaling.py tests/test_geometry_sampling.py tests/test_public_api.py tests/test_package_scope.py tests/test_package_layout.py tests/test_execution_hotpaths.py tests/test_mitigation.py tests/test_model_streaming.py tests/test_backends.py tests/test_providers.py tests/test_shared_readouts.py tests/test_conversion_plan.py tests/test_resource_audit.py tests/test_source_boundaries.py tests/test_resource_profiles.py tests/test_environment_report.py tests/test_scientific_scale.py tests/test_semantic_compiler.py tests/test_adaptive_execution.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: installation-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python }}
          path: |
            install-report.json
            environment-report.json
