name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "ruff>=0.11"
      - run: ruff check .
      - run: ruff format --check .
      - name: Show formatting changes on failure
        if: failure()
        run: ruff format --diff .
  tensor-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install . pytest
      - run: python -m pytest -q tests/test_contraction_compiler.py tests/test_distributed_compute.py
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the core and test runner
        run: python -m pip install . pytest
      - run: python -m pip check
      - name: Verify shared compute policies and failure contracts
        run: python -m pytest -q tests/test_compute_kernel.py tests/test_reliability.py
      - name: Exercise exact conversion without framework dependencies
        run: python -m pytest -q tests/test_precision_regressions.py tests/test_audit_regressions.py tests/test_switch_lowering.py tests/test_risk_budget.py tests/test_tensor_streaming.py tests/test_model_checkpoint.py tests/test_model_selection.py tests/test_walk_forward.py tests/test_conversion_sweeps.py tests/test_finance_execution.py tests/test_simple_api.py tests/test_adaptive_amplitude.py tests/test_amplitude.py tests/test_finance.py tests/test_frontier_models.py tests/test_network_operators.py tests/test_architecture.py tests/test_deep_learning.py tests/test_cost_scheduling.py tests/test_calibration.py tests/test_distributed_compute.py tests/test_multiscale_execution.py tests/test_gradient_accumulation.py tests/test_program_compilation.py tests/test_distributed_training.py tests/test_compute_contractions.py tests/test_contraction_compiler.py tests/test_runtime.py tests/test_hybrid_training.py tests/test_sparse_scaling.py tests/test_research_methods.py tests/test_exact_instrument.py tests/test_public_api.py tests/test_package_scope.py tests/test_package_layout.py tests/test_execution_hotpaths.py tests/test_mitigation.py tests/test_model_streaming.py tests/test_environment_report.py tests/test_conversion_preparation.py tests/test_ir.py tests/test_simulator.py tests/test_qasm_feedback.py
      - run: python -m openqml doctor --report --check-imports --sizes --output core-environment.json
      - uses: actions/upload-artifact@v4
        with:
          name: core-installation-${{ runner.os }}
          path: core-environment.json
  full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Select CPU PyTorch for the CI runner
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[all,dev]"
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python -m twine check dist/*
  legacy-frameworks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "torch==2.2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "numpy==1.26.4" "jax==0.4.30" "jaxlib==0.4.30" "optax==0.2.3" "chex==0.1.87"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q tests/test_execution_hotpaths.py tests/test_package_layout.py tests/test_compute_kernel.py tests/test_reliability.py tests/test_native_constant_cache.py
  compiled-transforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "torch==2.4.1" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "numpy==1.26.4" . pytest
      - run: python -m pytest -q tests/test_execution_hotpaths.py tests/test_package_layout.py
  portable-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: macos-15-intel
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[all,dev]" --report install-report.json
      - run: python -m pip check
      - run: python -m openqml doctor --extra all --check-imports --sizes --output environment-report.json
      - run: python -m pytest -q tests/test_compute_kernel.py tests/test_reliability.py tests/test_precision_regressions.py tests/test_audit_regressions.py tests/test_switch_lowering.py tests/test_risk_budget.py tests/test_tensor_streaming.py tests/test_model_checkpoint.py tests/test_model_selection.py tests/test_walk_forward.py tests/test_conversion_sweeps.py tests/test_finance_execution.py tests/test_simple_api.py tests/test_adaptive_amplitude.py tests/test_amplitude.py tests/test_finance.py tests/test_frontier_models.py tests/test_algorithmic_execution.py tests/test_network_operators.py tests/test_architecture.py tests/test_deep_learning.py tests/test_cost_scheduling.py tests/test_calibration.py tests/test_distributed_compute.py tests/test_multiscale_execution.py tests/test_gradient_accumulation.py tests/test_program_compilation.py tests/test_distributed_training.py tests/test_compute_contractions.py tests/test_contraction_compiler.py tests/test_runtime.py tests/test_hybrid_training.py tests/test_sparse_scaling.py tests/test_research_methods.py tests/test_public_api.py tests/test_package_scope.py tests/test_package_layout.py tests/test_execution_hotpaths.py tests/test_mitigation.py tests/test_model_streaming.py tests/test_backends.py tests/test_providers.py tests/test_shared_readouts.py tests/test_conversion_plan.py tests/test_resource_audit.py tests/test_source_boundaries.py tests/test_resource_profiles.py tests/test_environment_report.py tests/test_scientific_scale.py tests/test_semantic_compiler.py tests/test_adaptive_execution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python }}
          path: |
            install-report.json
            environment-report.json
